<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connexion à votre compte QFQA - Emploi du temps adapté aux neurodivergents">
    <meta name="theme-color" content="#0066cc">
    <title>Connexion - QFQA</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanilla-framework@4.13.0/build/css/build.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="l-application has-sticky-nav">
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>
    
    <!-- Navigation responsive -->
    <div id="navigation-placeholder"></div>

    <main class="l-main with-nav" id="main-content" tabindex="-1">
        <div class="row">
            <div class="col-12 col-medium-6 col-large-4 u-align--center">
                <div class="p-card">
                    <div class="p-card__header">
                        <h2 class="p-heading--2">Connexion à QFQA</h2>
                        <p class="u-text--muted">Accédez à votre espace personnel</p>
                    </div>
                    
                    <div class="p-card__content">
                        <form 
                            hx-post="/api/collections/users/auth-with-password" 
                            hx-target="#login-response"
                            hx-disabled-elt="#login-submit"
                            id="login-form"
                            novalidate
                        >
                            <div class="form-group">
                                <label for="username" class="form-label">
                                    Nom d'utilisateur *
                                </label>
                                <input 
                                    type="text" 
                                    id="username" 
                                    name="identity"
                                    class="form-input"
                                    required
                                    autocomplete="username"
                                    aria-describedby="username-help"
                                    placeholder="Votre nom d'utilisateur"
                                >
                                <div class="form-help" id="username-help">
                                    Utilisez votre nom d'utilisateur ou adresse email.
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">
                                    Mot de passe *
                                </label>
                                <div class="password-field">
                                    <input 
                                        type="password" 
                                        id="password" 
                                        name="password"
                                        class="form-input"
                                        required
                                        autocomplete="current-password"
                                        aria-describedby="password-help"
                                        placeholder="Votre mot de passe"
                                    >
                                    <button 
                                        type="button" 
                                        class="password-toggle"
                                        aria-label="Afficher le mot de passe"
                                        id="password-toggle-btn"
                                    >
                                        👁️
                                    </button>
                                </div>
                                <div class="form-help" id="password-help">
                                    Au moins 8 caractères requis.
                                </div>
                            </div>

                            <div id="login-response" aria-live="polite" aria-atomic="true"></div>

                            <div class="p-button-group">
                                <button 
                                    type="submit" 
                                    class="p-button--positive"
                                    id="login-submit"
                                >
                                    Se connecter
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="auth-links u-sv2">
                    <div class="p-button-group">
                        <button 
                            type="button"
                            class="p-button--base"
                            hx-get="/register.html"
                            hx-target="#main-content"
                            hx-push-url="true"
                        >
                            Créer un compte
                        </button>
                        
                        <button 
                            type="button" 
                            class="p-button--base"
                            hx-get="/forgot-password.html"
                            hx-target="#main-content"
                            hx-push-url="true"
                        >
                            Mot de passe oublié ?
                        </button>
                    </div>

                    <!-- Mode démo -->
                    <div class="demo-section u-sv2">
                        <div class="p-notification--information">
                            <p class="p-notification__response">
                                <strong>Essayer sans compte :</strong>
                                Découvrez QFQA avec des données d'exemple.
                            </p>
                            <div class="p-notification__action">
                                <button 
                                    type="button"
                                    class="p-button--neutral"
                                    hx-post="/api/demo-login"
                                    hx-target="#login-response"
                                >
                                    🚀 Essayer la démo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="l-footer" role="contentinfo">
        <div class="row">
            <div class="col-12">
                <p>&copy; 2024 QFQA - Organiser son quotidien avec bienveillance</p>
            </div>
        </div>
    </footer>

    <script src="/js/load-navigation.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
