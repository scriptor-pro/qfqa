<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0066cc"/>
  
  <!-- Brain icon in white -->
  <g fill="white" stroke="white" stroke-width="0.5">
    <!-- Left hemisphere -->
    <path d="M8 12c-1.5 0-2.5 1-2.5 2.5s1 2.5 2.5 2.5c0 1.5 1 2.5 2.5 2.5s2.5-1 2.5-2.5c1.5 0 2.5-1 2.5-2.5s-1-2.5-2.5-2.5c0-1.5-1-2.5-2.5-2.5s-2.5 1-2.5 2.5z"/>
    
    <!-- Right hemisphere -->
    <path d="M17 12c0-1.5 1-2.5 2.5-2.5s2.5 1 2.5 2.5c1.5 0 2.5 1 2.5 2.5s-1 2.5-2.5 2.5c0 1.5-1 2.5-2.5 2.5s-2.5-1-2.5-2.5c-1.5 0-2.5-1-2.5-2.5s1-2.5 2.5-2.5z"/>
    
    <!-- Neural connections -->
    <circle cx="10" cy="13" r="0.8" fill="white"/>
    <circle cx="13" cy="15" r="0.8" fill="white"/>
    <circle cx="10" cy="17" r="0.8" fill="white"/>
    <circle cx="19" cy="13" r="0.8" fill="white"/>
    <circle cx="22" cy="15" r="0.8" fill="white"/>
    <circle cx="19" cy="17" r="0.8" fill="white"/>
    
    <!-- Central connection -->
    <line x1="13" y1="14.5" x2="19" y2="14.5" stroke="white" stroke-width="1" opacity="0.7"/>
  </g>
  
  <!-- Small "Q" in the bottom right -->
  <text x="22" y="26" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">Q</text>
</svg>