[build]
  publish = "public"
  
[build.environment]
  NODE_VERSION = "18"

# Proxy API vers le backend optimisé
[[redirects]]
  from = "/api/*"
  to = "https://qfqa-backend-optimized.render.com/api/:splat"
  status = 200
  force = true

# Configuration des en-têtes optimisés
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' https://qfqa-backend-optimized.render.com;"

# Cache optimisé pour les assets
[[headers]]
  for = "/css/* /js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200